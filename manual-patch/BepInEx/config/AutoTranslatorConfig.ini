; Hank: Straightjacket 汉化 - XUnity.AutoTranslator 字体配置
; 本文件只需包含需要覆盖的设置，其余选项 XUnity 会自动使用默认值。
; 作用：让 TMP 文本用系统字体 Noto Sans SC 渲染中文（缺这个中文字会显示方块）。

[Behaviour]
OverrideFont=Noto Sans SC
OverrideFontSize=
OverrideFontTextMeshPro=Noto Sans SC
FallbackFontTextMeshPro=
EnableUIResizing=True
MaxCharactersPerTranslation=1000
